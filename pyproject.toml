[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netmon"
version = "0.1.0"
description = "Terminal network traffic monitor: connections as nested treemaps, split into intranet and internet"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["textual>=0.80"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
netmon = "netmon.__main__:main"

[tool.setuptools]
packages = ["netmon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
